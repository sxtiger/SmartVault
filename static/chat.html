<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartVault 知识问答</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1f2328; --sub:#6b7280; --brand:#4f46e5; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
         background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:10px; padding:12px 20px;
           background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  #meta { color:var(--sub); font-size:12px; }
  #dot { width:8px; height:8px; border-radius:50%; background:#9ca3af; flex:none; }
  #dot.ok { background:#10b981; } #dot.bad { background:#ef4444; }
  main { flex:1; overflow-y:auto; padding:20px 20px 8px; }
  .msg { max-width:820px; margin:0 auto 16px; }
  .msg .who { font-size:12px; color:var(--sub); margin-bottom:4px; }
  .bubble { padding:12px 16px; border-radius:12px; line-height:1.75; white-space:pre-wrap; word-break:break-word; }
  .user .who { text-align:right; }
  .user .bubble { background:var(--brand); color:#fff; margin-left:120px; }
  .bot .bubble { background:var(--card); border:1px solid var(--line); margin-right:120px; }
  .bubble code { background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .user .bubble code { background:rgba(255,255,255,.25); }
  .srcs { max-width:820px; margin:-8px auto 16px; font-size:12px; color:var(--sub); }
  .srcs span { display:inline-block; margin:2px 6px 2px 0; padding:2px 8px;
               background:var(--card); border:1px solid var(--line); border-radius:999px; }
  footer { display:flex; gap:10px; padding:14px 20px; background:var(--card); border-top:1px solid var(--line); }
  #q { flex:1; resize:none; height:56px; padding:10px 14px; border:1px solid var(--line);
       border-radius:10px; font:inherit; outline:none; }
  #q:focus { border-color:var(--brand); }
  button { border:none; background:var(--brand); color:#fff; font-size:14px;
           padding:0 24px; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { max-width:820px; margin:0 auto 14px; font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<header><span id="dot"></span><h1>SmartVault 知识问答</h1><span id="meta">连接中…</span></header>
<main id="chat">
  <div class="hint">向本地知识库提问（回答基于已索引笔记，附来源引用）。Enter 发送 · Shift+Enter 换行</div>
</main>
<footer>
  <textarea id="q" placeholder="例如：传播大脑科技的测试工程师面试要准备什么？" autofocus></textarea>
  <button id="send">提问</button>
</footer>
<script>
const $chat = document.getElementById('chat'), $q = document.getElementById('q'),
      $send = document.getElementById('send'), $meta = document.getElementById('meta'),
      $dot = document.getElementById('dot');
let busy = false;

async function refreshStatus(){
  try{
    const s = await (await fetch('/status')).json();
    $dot.className = 'ok';
    $meta.textContent = `已索引 ${s.files_indexed} 篇 · ${s.chunks} 分块 · 模型 ${s.lm_studio_model}`;
  }catch(e){ $dot.className = 'bad'; $meta.textContent = '服务不可用（请用菜单栏启动 RAG 服务后刷新）'; }
}
refreshStatus(); setInterval(refreshStatus, 30000);

function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mdLite(s){  /* 轻量 Markdown：标题 / 加粗 / 行内代码（离线无 CDN，遵守隐私承诺） */
  return esc(s)
    .replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function addMsg(role, html){
  const d = document.createElement('div'); d.className = 'msg ' + role;
  d.innerHTML = `<div class="who">${role === 'user' ? '你' : 'SmartVault'}</div><div class="bubble"></div>`;
  d.querySelector('.bubble').innerHTML = html;
  $chat.appendChild(d); $chat.scrollTop = $chat.scrollHeight;
  return d.querySelector('.bubble');
}

async function ask(){
  const text = $q.value.trim();
  if (!text || busy) return;
  busy = true; $send.disabled = true;
  addMsg('user', esc(text));
  $q.value = '';
  const bubble = addMsg('bot', '检索中…');
  let answer = '', sawErr = false;
  try{
    const resp = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'},
                                      body: JSON.stringify({query: text, stream: true})});
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for(;;){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const blocks = buf.split('\n\n'); buf = blocks.pop();
      for (const b of blocks){
        const ev  = (b.match(/^event:\s*(.+)$/m)  || [])[1];
        const dat = (b.match(/^data:\s*(.+)$/m) || [])[1];
        if (!ev || dat === undefined) continue;
        if (ev === 'sources'){
          const srcs = JSON.parse(dat);
          const div = document.createElement('div'); div.className = 'srcs';
          div.innerHTML = '<b>参考来源：</b>' + srcs.map(s =>
            `<span title="余弦距离 ${s.distance}">${esc(s.title)} · ${esc(s.path)}</span>`).join('');
          $chat.insertBefore(div, bubble.closest('.msg'));
        } else if (ev === 'message'){
          answer += JSON.parse(dat).delta;
          bubble.innerHTML = mdLite(answer);
          $chat.scrollTop = $chat.scrollHeight;
        } else if (ev === 'error'){
          sawErr = true;
          bubble.innerHTML = '⚠ ' + esc(JSON.parse(dat).error);
        }
      }
    }
    if (!answer && !sawErr) bubble.textContent = '（无回答）';
  }catch(e){
    bubble.innerHTML = '⚠ 请求失败：' + esc(String(e)) + '<br>请确认 RAG 服务与 LM Studio 正在运行（菜单栏图标应为 ●）';
  }
  busy = false; $send.disabled = false; $q.focus();
}

$send.onclick = ask;
$q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});
</script>
</body>
</html>
